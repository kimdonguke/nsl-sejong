[home_research_title]
other = "Research Areas"

[home_research_desc]
other = "Our lab focuses on cutting-edge research in satellite navigation and positioning technologies, bridging theoretical innovation with practical applications."

[home_card_gnss_title]
other = "GNSS Signal Processing"

[home_card_gnss_desc]
other = "Advanced algorithms for acquisition, tracking, and positioning using GPS, GLONASS, Galileo, and BeiDou signals. Research includes anti-jamming, anti-spoofing, and multipath mitigation techniques."

[home_card_integration_title]
other = "Integrated Navigation"

[home_card_integration_desc]
other = "Sensor fusion of GNSS with IMU, barometers, and vision systems. Development of robust Kalman filter architectures for seamless navigation in GNSS-degraded and denied environments."

[home_card_autonomous_title]
other = "Autonomous Navigation"

[home_card_autonomous_desc]
other = "Navigation solutions for autonomous vehicles and UAVs. Combining GNSS/INS with LiDAR, camera, and HD maps for precise localization in urban and challenging environments."

